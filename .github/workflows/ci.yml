name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend Quality Gate (Audit, Lint, Format, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: APP
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: APP/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Unit Tests (Vitest)
        run: npm test

      - name: Run Production Bundle Build (TypeScript & Vite)
        run: npm run build

      - name: Archive Production Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: APP/dist
          retention-days: 7

  backend:
    name: Auxiliary Backend Check (Non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: APP/server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: APP/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile Backend TypeScript
        run: npm run build
